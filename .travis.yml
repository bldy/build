language: go
go:
  - 1.7
  - tip
go_import_path: bldy.build/build
install:
  - go get -v -t -d bldy.build/build/...
script:
  - go test -race -coverprofile=coverage.txt -covermode=atomic -v bldy.build/build/lexer
  - go test -race -coverprofile=coverage.txt -covermode=atomic -v bldy.build/build/internal
  - go test -race -coverprofile=coverage.txt -covermode=atomic -v bldy.build/build/parser
  - go test -race -coverprofile=coverage.txt -covermode=atomic -v bldy.build/build/preprocessor
  - go test -race -coverprofile=coverage.txt -covermode=atomic -v bldy.build/build/processor
after_success:
  - bash <(curl -s https://codecov.io/bash)
